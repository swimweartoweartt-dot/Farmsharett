name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli

      - name: Init Capacitor
        run: |
          npx cap init farmsharett com.farmsharett.app
          npx cap add android

      - name: Build Web Files
        run: |
          mkdir www
          cp index.html www/
          cp app.js www/
          cp style.css www/

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farmsharett-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
